<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaltsit</title>
    <link rel="icon" type="image/png" href="rhodes.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      rel="stylesheet">
    <style>

        /* --- 1. 搜索组件区域 --- */
        .search-container {
            width: 100%; max-width: 520px; 
            
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 60px;
            
            position: relative; 
            z-index: 100; 
        }

        /* 搜索框外壳 */
        .search-wrapper {
            position: relative; width: 100%; height: 50px; border-radius: 50px;
            /* 主搜素框毛玻璃 */
            background: rgba(255, 255, 255, 0.25); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex; align-items: center;
            transition: all 0.3s ease;
            z-index: 10; /* 保证在下拉菜单之上 */
        }

        .search-wrapper:hover, .search-wrapper:focus-within {
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        /* 引擎切换按钮 */
        .engine-switch {
            width: 70px; height: 100%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; color: #fff; font-size: 18px;
            border-right: 1px solid rgba(255,255,255,0.2);
            position: relative; gap: 5px;
        }
        .engine-switch:hover { background: rgba(255,255,255,0.1); border-radius: 50px 0 0 50px; }
        .arrow-down { font-size: 10px; opacity: 0.7; transition: transform 0.3s; }
        
        /* 当菜单打开时，小箭头旋转 */
        .engine-switch.active .arrow-down { transform: rotate(180deg); }

        /* 输入框 */
        .search-box {
            flex: 1; height: 100%; border: none; background: transparent;
            outline: none; padding: 0 20px; font-size: 16px; color: #fff;
        }
        .search-box::placeholder { color: rgba(255, 255, 255, 0.7); }

        /* --- 下拉菜单通用动画类 (关键修改) --- */
        .dropdown-menu-base {
            position: absolute; left: 0; 
            background: rgba(255, 255, 255, 0.25); /* 透明度调低，显现毛玻璃 */
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3); /* 增加高光边框 */
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            border-radius: 15px;
            overflow: hidden;
            
            /* 动画初始状态：隐藏、上移、透明 */
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); /* 贝塞尔曲线让动画更自然 */
        }

        /* 激活状态：显示、复位、不透明 */
        .dropdown-menu-base.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* 引擎选择菜单特定样式 */
        .engine-dropdown {
            top: 60px; width: 130px;
            flex-direction: column;
            display: flex;
            z-index: 20;
        }
        
        /* 联想词列表特定样式 */
        .suggestions-list {
            top: 60px; width: 100%;
            list-style: none; padding: 10px 0; margin: 0;
            z-index: 15;
        }

        /* 菜单项交互 */
        .engine-option, .suggestions-list li {
            padding: 12px 20px; cursor: pointer; color: #fff; /* 文字改为白色以适应深色背景，或深色加阴影 */
            text-shadow: 0 1px 2px rgba(0,0,0,0.5); /* 增加文字阴影防止在亮背景看不清 */
            font-size: 15px; display: flex; align-items: center; gap: 10px;
            transition: background 0.2s;
        }
        
        .engine-option:hover, .suggestions-list li:hover {
            background: rgba(255, 255, 255, 0.3); /* 悬浮加亮 */
        }
        
        .engine-option i { width: 20px; text-align: center; }

        /* --- 2. 图标区域 --- */
      .icon-container {
           display: flex;
           justify-content: center;
           align-items: center;
           flex-wrap: wrap;

           gap: 35px;

           width: 80%;
           max-width: 800px;

    margin-left: auto;
    margin-right: auto;

    z-index: 5;
}
        .icon-item {
            text-decoration: none; display: flex; flex-direction: column; align-items: center;
            transition: transform 0.3s;
        }
        .icon-circle {
            width: 65px; height: 65px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 28px; color: #fff;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        .icon-circle > i {
    display: block;
    line-height: 1;
    text-align: center;
}
        .icon-item:hover { transform: translateY(-8px); }
        .icon-item:hover .icon-circle {
            background: rgba(255, 255, 255, 0.4); box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

/* --- 3. 设置组件：毛玻璃风格 --- */

/* 右下角设置按钮 */
.settings-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;

    width: 46px;
    height: 46px;

    display: flex;
    justify-content: center;
    align-items: center;

    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 50%;

    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    color: #fff;
    font-size: 18px;

    box-shadow: 0 4px 18px rgba(0,0,0,0.25);

    cursor: pointer;
    z-index: 200;

    transition:
        background 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease;
}

.settings-btn:hover {
    background: rgba(255,255,255,0.30);
    transform: rotate(45deg) scale(1.08);
    box-shadow: 0 8px 25px rgba(0,0,0,0.30);
}


/* 整个弹窗遮罩 */
.modal {
    display: none;

    position: fixed;
    inset: 0;

    padding: 24px;
    box-sizing: border-box;

    justify-content: center;
    align-items: center;

    background: rgba(0,0,0,0.38);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    z-index: 300;
}


/* 管理窗口主体 */
.modal-content {
    width: min(920px, 100%);
    max-height: 82vh;

    box-sizing: border-box;

    display: flex;
    flex-direction: column;

    padding: 0;

    border-radius: 24px;

    color: #fff;

    background: rgba(30, 35, 40, 0.68);

    backdrop-filter: blur(30px) saturate(140%);
    -webkit-backdrop-filter: blur(30px) saturate(140%);

    border: 1px solid rgba(255,255,255,0.22);

    box-shadow:
        0 20px 60px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.12);

    overflow: hidden;

    animation: modalOpen 0.25s ease;
}


/* 弹窗出现动画 */
@keyframes modalOpen {
    from {
        opacity: 0;
        transform: translateY(12px) scale(0.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


/* 标题栏 */
.modal-header {
    flex-shrink: 0;

    display: flex;
    justify-content: space-between;
    align-items: center;

    margin: 0;
    padding: 22px 26px;

    font-size: 20px;
    font-weight: 600;

    border-bottom: 1px solid rgba(255,255,255,0.12);

    background: rgba(255,255,255,0.05);
}


/* 关闭按钮 */
.close-btn {
    width: 36px;
    height: 36px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 50%;

    font-size: 24px;
    font-weight: 300;

    color: rgba(255,255,255,0.75);

    cursor: pointer;

    transition: all 0.2s ease;
}

.close-btn:hover {
    color: #fff;
    background: rgba(255,255,255,0.14);
    transform: rotate(90deg);
}


/* 中间可滚动区域 */
.modal-body {
    padding: 22px 26px 26px;

    overflow-y: auto;
    overflow-x: hidden;
}


/* 快捷方式列表 */
.modal-body ul {
    list-style: none;

    padding: 0;
    margin: 0;

    display: flex;
    flex-direction: column;

    gap: 10px;
}


/* 每一行 */
.modal-body li {
    display: grid;

    grid-template-columns:
        minmax(120px, 0.8fr)
        minmax(190px, 1.1fr)
        minmax(260px, 1.8fr)
        42px;

    gap: 10px;

    align-items: center;

    margin: 0;
    padding: 8px;

    border-radius: 14px;

    background: rgba(255,255,255,0.055);

    border: 1px solid rgba(255,255,255,0.07);

    transition: background 0.2s ease;
}

.modal-body li:hover {
    background: rgba(255,255,255,0.09);
}


/* 输入框 */
.modal-body input {
    width: 100%;
    min-width: 0;

    box-sizing: border-box;

    padding: 11px 13px;

    border-radius: 10px;

    border: 1px solid rgba(255,255,255,0.15);

    outline: none;

    color: #fff;

    font-size: 14px;

    background: rgba(0,0,0,0.18);

    transition:
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
}

.modal-body input::placeholder {
    color: rgba(255,255,255,0.42);
}

.modal-body input:hover {
    background: rgba(0,0,0,0.25);
}

.modal-body input:focus {
    border-color: rgba(255,255,255,0.55);

    background: rgba(0,0,0,0.30);

    box-shadow:
        0 0 0 3px rgba(255,255,255,0.08);
}


/* 通用按钮 */
.btn {
    border: none;
    outline: none;

    cursor: pointer;

    font-family: inherit;

    transition: all 0.2s ease;
}


/* 删除按钮 */
.btn-red {
    width: 42px;
    height: 42px;

    padding: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 10px;

    color: rgba(255,255,255,0.75);

    background: rgba(255,80,80,0.12);

    border: 1px solid rgba(255,100,100,0.15);
}

.btn-red:hover {
    color: #fff;

    background: rgba(255,70,70,0.38);

    border-color: rgba(255,100,100,0.45);

    transform: scale(1.05);
}


/* 新增网站按钮 */
.btn-green {
    width: 100%;

    margin-top: 20px;
    padding: 13px 20px;

    border-radius: 14px;

    font-size: 15px;
    font-weight: 500;

    color: #fff;

    background: rgba(255,255,255,0.12);

    border: 1px solid rgba(255,255,255,0.18);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.btn-green:hover {
    background: rgba(255,255,255,0.24);

    border-color: rgba(255,255,255,0.30);

    transform: translateY(-1px);

    box-shadow: 0 5px 18px rgba(0,0,0,0.20);
}


/* 滚动条 */
.modal-body::-webkit-scrollbar {
    width: 6px;
}

.modal-body::-webkit-scrollbar-track {
    background: transparent;
}

.modal-body::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.22);
    border-radius: 10px;
}

.modal-body::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,0.35);
}


/* 手机 / 窄屏适配 */
@media (max-width: 720px) {

    .modal {
        padding: 12px;
    }

    .modal-content {
        max-height: 88vh;
        border-radius: 20px;
    }

    .modal-header {
        padding: 18px 18px;
        font-size: 18px;
    }

    .modal-body {
        padding: 16px;
    }

    .modal-body li {
        grid-template-columns: 1fr 42px;
        gap: 8px;
        padding: 10px;
    }

    .modal-body li input {
        grid-column: 1;
    }

    .modal-body li .btn-red {
        grid-column: 2;
        grid-row: 1 / 4;

        align-self: stretch;
        height: auto;
    }
}

        (function() {
            const cachedUrl = localStorage.getItem('kaltsit_bg_url');

                // 动态生成一个 style 标签，直接覆盖 body 的背景

</head>
<body>

    <div class="search-container">
        <form id="searchForm" action="https://cn.bing.com/search" method="get" target="_blank">
            <div class="search-wrapper">
                <div class="engine-switch" id="engineSwitchBtn" title="切换搜索引擎">
                    <i class="fa-brands fa-microsoft" id="currentEngineIcon"></i>
                    <i class="fa-solid fa-caret-down arrow-down"></i>
                </div>
                <input type="text" name="q" id="searchInput" class="search-box" placeholder="Search Bing..." autocomplete="off" autofocus>
            </div>
        </form>

        <div class="dropdown-menu-base engine-dropdown" id="engineDropdown">
            <div class="engine-option" onclick="selectEngine('bing')">
                <i class="fa-brands fa-microsoft" style="color: #fff;"></i> Bing
            </div>
            <div class="engine-option" onclick="selectEngine('baidu')">
                <i class="fa-solid fa-paw" style="color: #fff;"></i> 百度
            </div>
            <div class="engine-option" onclick="selectEngine('google')">
                <i class="fa-brands fa-google" style="color: #fff;"></i> Google
            </div>
        </div>

        <ul class="dropdown-menu-base suggestions-list" id="suggestionsList"></ul>
    </div>

    <div class="icon-container" id="iconContainer"></div>

    <button class="settings-btn" onclick="openModal()"><i class="fa-solid fa-gear"></i></button>
    
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>管理快捷方式</span>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <ul id="editList"></ul>
                <button class="btn btn-green" onclick="addNewItem()"><i class="fa-solid fa-plus"></i> 新增网站</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 引擎逻辑 ---
        const engines = {
            bing:   { name: 'Bing',   url: 'https://cn.bing.com/search',      key: 'q',  icon: 'fa-brands fa-microsoft' },
            baidu:  { name: '百度',    url: 'https://www.baidu.com/s',         key: 'wd', icon: 'fa-solid fa-paw' },
            google: { name: 'Google', url: 'https://www.google.com/search',   key: 'q',  icon: 'fa-brands fa-google' }
        };
        
        let currentEngine = localStorage.getItem('searchEngine') || 'bing';

        function selectEngine(key) {
            currentEngine = key;
            const config = engines[key];
            document.getElementById('searchForm').action = config.url;
            document.getElementById('searchInput').name = config.key;
            document.getElementById('searchInput').placeholder = `Search ${config.name}...`;
            document.getElementById('currentEngineIcon').className = config.icon;
            
            // 使用 classList 控制显示/隐藏，触发动画
            document.getElementById('engineDropdown').classList.remove('show');
            document.getElementById('engineSwitchBtn').classList.remove('active');
            
            localStorage.setItem('searchEngine', key);
        }
        selectEngine(currentEngine);

        // --- 2. 搜索联想 ---
        const searchInput = document.getElementById('searchInput');
        const suggestionsList = document.getElementById('suggestionsList');

        searchInput.addEventListener('input', function() {
            const val = this.value.trim();
            if (!val) { 
                suggestionsList.classList.remove('show'); // 动画隐藏
                return; 
            }
            
            const script = document.createElement('script');
            script.src = `https://suggestion.baidu.com/su?wd=${encodeURIComponent(val)}&cb=window.baiduSuggestion`;
            document.body.appendChild(script);
        });

        window.baiduSuggestion = function(data) {
            const list = data.s;
            if (!list.length) { 
                suggestionsList.classList.remove('show');
                return; 
            }
            
            suggestionsList.innerHTML = '';
            list.slice(0, 6).forEach(text => {
                const li = document.createElement('li');
                li.innerHTML = `<i class="fa-solid fa-magnifying-glass" style="font-size:12px; opacity:0.7;"></i> ${text}`;
                li.onclick = () => {
                    searchInput.value = text;
                    document.getElementById('searchForm').submit();
                    suggestionsList.classList.remove('show');
                };
                suggestionsList.appendChild(li);
            });
            // 动画显示
            suggestionsList.classList.add('show');
            // 如果联想出现，强制关闭引擎菜单
            document.getElementById('engineDropdown').classList.remove('show');
        };

        // --- 3. 交互控制 ---
        document.getElementById('engineSwitchBtn').onclick = (e) => {
            e.stopPropagation();
            const dd = document.getElementById('engineDropdown');
            const btn = document.getElementById('engineSwitchBtn');
            const list = document.getElementById('suggestionsList');

            // 切换 active/show 类
            if (dd.classList.contains('show')) {
                dd.classList.remove('show');
                btn.classList.remove('active');
            } else {
                dd.classList.add('show');
                btn.classList.add('active');
                list.classList.remove('show'); // 打开引擎菜单时，关闭联想
            }
        };

        window.onclick = (e) => {
            if (e.target == document.getElementById('settingsModal')) closeModal();
            if (!e.target.closest('.search-container')) {
                // 点击外部，优雅关闭所有菜单
                document.getElementById('engineDropdown').classList.remove('show');
                document.getElementById('engineSwitchBtn').classList.remove('active');
                document.getElementById('suggestionsList').classList.remove('show');
            }
        };

        // --- 4. 网址管理 (不变) ---
        const defaultLinks = [
            { name: "Bilibili", url: "https://www.bilibili.com", icon: "fa-brands fa-bilibili" },
            { name: "GitHub",   url: "https://github.com",       icon: "fa-brands fa-github" },
            { name: "知乎",     url: "https://www.zhihu.com",    icon: "fa-brands fa-zhihu" },
            { name: "邮箱",     url: "https://mail.qq.com",      icon: "fa-solid fa-envelope" }
        ];
        let links = JSON.parse(localStorage.getItem('myLinks')) || defaultLinks;
        const container = document.getElementById('iconContainer');
        const editList = document.getElementById('editList');
        const modal = document.getElementById('settingsModal');

        function renderIcons() {
            container.innerHTML = '';
            links.forEach(link => {
                const a = document.createElement('a');
                a.className = 'icon-item'; a.href = link.url; a.target = '_blank'; a.title = link.name;
                a.innerHTML = `<div class="icon-circle"><i class="${link.icon}"></i></div>`;
                container.appendChild(a);
            });
        }
function renderEditList() {
    editList.innerHTML = '';

    links.forEach((link, i) => {
        const li = document.createElement('li');

        li.innerHTML = `
            <input
                type="text"
                value="${link.name}"
                placeholder="网站名称"
                oninput="updateLink(${i}, 'name', this.value)"
            >

            <input
                type="text"
                value="${link.icon}"
                placeholder="Font Awesome 图标，例如 fa-brands fa-github"
                oninput="updateLink(${i}, 'icon', this.value)"
            >

            <input
                type="text"
                value="${link.url}"
                placeholder="https://example.com"
                oninput="updateLink(${i}, 'url', this.value)"
            >

            <button
                class="btn btn-red"
                onclick="delLink(${i})"
                title="删除快捷方式"
            >
                <i class="fa-solid fa-trash"></i>
            </button>
        `;

        editList.appendChild(li);
    });
}
        function updateLink(i, k, v) { links[i][k] = v; save(); }
        function delLink(i) { if(confirm('确定删除?')) { links.splice(i,1); renderEditList(); save(); } }
        function addNewItem() { links.push({name:'新网站', url:'https://', icon:'fa-solid fa-link'}); renderEditList(); save(); }
        function save() { localStorage.setItem('myLinks', JSON.stringify(links)); renderIcons(); }
        function openModal() { renderEditList(); modal.style.display = 'flex'; }
        function closeModal() { modal.style.display = 'none'; }
        renderIcons();
        // --- 5. 背景壁纸缓存与静默更新 ---
       // --- 5. 背景壁纸每日静默更新 ---
        function checkDailyBackground() {
            const cacheKey = 'kaltsit_bg_url';
            const dateKey = 'kaltsit_bg_date';
            
            // 获取今天的日期字符串，例如 "Fri May 15 2026"
            const today = new Date().toDateString(); 
            const lastUpdate = localStorage.getItem(dateKey);
            const cachedUrl = localStorage.getItem(cacheKey);

            // 如果今天没初始化过，或者发现跨天了，才去请求 API
            if (!cachedUrl || lastUpdate !== today) {
                const bingApi = 'https://cn.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1';
                fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(bingApi)}`)
                    .then(res => res.json())
                    .then(data => {
                        const parsed = JSON.parse(data.contents);
                        const realUrl = 'https://cn.bing.com' + parsed.images[0].url;

                        // 如果发现直链确实变了（有新壁纸）
                        if (realUrl !== cachedUrl) {
                            const preloadImg = new Image();
                            preloadImg.src = realUrl;
                            preloadImg.onload = () => {
                                // 赋予渐变属性，让新老壁纸平滑过渡
                                document.body.style.transition = 'background-image 1s ease-in-out';
                                document.body.style.backgroundImage = `url('${realUrl}')`;
                                
                                // 更新缓存和日期
                                localStorage.setItem(cacheKey, realUrl);
                                localStorage.setItem(dateKey, today);
                            };
                        } else {
                            // 即使壁纸没变，也把日期更新为今天，防止今天内重复请求
                            localStorage.setItem(dateKey, today);
                        }
                    })
                    .catch(err => console.warn('背景同步检查失败:', err));
            }
        }

        checkDailyBackground();
    </script>
</body>
</html>
